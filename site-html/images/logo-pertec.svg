<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stylized script "Per" -->
  <g filter="url(#glow)">
    <!-- P with flourish -->
    <path d="M8 52 L16 8 Q17 4 20 4 L22 4 Q28 4 32 8 Q36 12 36 18 Q36 26 30 30 Q26 33 20 33 L18 33 L14 52 Q13 56 10 56 Q7 56 8 52 Z M20 10 L17 28 Q22 28 26 25 Q30 22 30 17 Q30 12 26 10 Q24 10 20 10 Z"
          fill="url(#grad1)"/>

    <!-- e script -->
    <path d="M44 24 Q52 20 56 24 Q60 28 58 36 Q56 42 48 46 Q42 48 38 44 Q34 40 36 32 Q38 24 48 22 Q54 22 56 28 L44 32 Q42 38 46 40 Q50 42 54 38"
          fill="none" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>

    <!-- r script -->
    <path d="M62 44 L66 26 Q67 22 72 22 Q76 22 78 26"
          fill="none" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Stylized "Tec" in gradient -->
  <g filter="url(#glow)">
    <!-- T with style -->
    <path d="M88 14 L120 10 M104 12 L98 52 Q97 56 100 56 Q103 56 104 52"
          fill="none" stroke="url(#grad2)" stroke-width="5" stroke-linecap="round"/>

    <!-- e script -->
    <path d="M118 28 Q126 24 130 28 Q134 32 132 40 Q130 46 122 50 Q116 52 112 48 Q108 44 110 36 Q112 28 122 26 Q128 26 130 32 L118 36 Q116 42 120 44 Q124 46 128 42"
          fill="none" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round"/>

    <!-- c script -->
    <path d="M152 30 Q144 28 140 34 Q136 40 140 46 Q144 52 152 50"
          fill="none" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Decorative dot with pulse -->
  <circle cx="164" cy="48" r="5" fill="#8b5cf6">
    <animate attributeName="r" values="5;6;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
