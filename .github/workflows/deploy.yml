name: Déploiement PlanetHoster (N0C)

# Pont GitHub -> serveur de prod via SSH (rsync + mot de passe).
# À chaque push, les fichiers modifiés sont synchronisés sur PlanetHoster N0C
# par SSH (port 5022). Authentification par mot de passe (pas de clé à gérer).
#
# Secrets à définir dans GitHub
#   (Settings > Secrets and variables > Actions > New repository secret) :
#     SSH_HOST      hôte SSH N0C (ex: nodeXXX-eu.n0c.com)
#     SSH_USER      identifiant SSH/N0C
#     SSH_PORT      5022
#     SSH_PASSWORD  mot de passe SSH/N0C
#     SSH_TARGET    dossier cible, ex: /home/USER/maloc.pertec.fr/ (finir par /)

on:
  push:
    branches:
      - main
      - claude/intelligent-turing-x84chm
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer rsync + sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y rsync sshpass

      - name: Déployer via SSH (rsync)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          sshpass -e rsync -rltzvO --delete \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='cahier_des_charges_pertec.md' \
            --exclude='config/config.php' \
            ./ "${SSH_USER}@${SSH_HOST}:${SSH_TARGET}"
