name: Déploiement PlanetHoster (N0C)

# Pont GitHub -> serveur de prod via SSH (rsync + clé).
# À chaque push, les fichiers modifiés sont synchronisés sur PlanetHoster N0C
# par SSH (port 5022), authentification par clé.
#
# Secrets à définir dans GitHub
#   (Settings > Secrets and variables > Actions > New repository secret) :
#     SSH_HOST         hôte SSH N0C (ex: nodeXXX-eu.n0c.com)
#     SSH_USER         identifiant SSH/N0C
#     SSH_PORT         5022
#     SSH_PRIVATE_KEY  clé privée (dont la clé publique est enregistrée dans N0C)
#     SSH_TARGET       dossier cible, ex: /home/USER/maloc.pertec.fr/ (finir par /)

on:
  push:
    branches:
      - main
      - claude/intelligent-turing-x84chm
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: ${{ secrets.SSH_TARGET }}
          ARGS: "-rltzvO --delete"
          EXCLUDE: ".git/, .github/, scripts/, *.md, cahier_des_charges_pertec.md, config/config.php"
